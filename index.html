<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recruiting Dashboard – EGYM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>Recruiting Dashboard <span class="badge">EGYM</span></h1>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="pipeline">Pipeline</button>
    <button class="tab" data-tab="sourcing">Sourcing</button>
    <button class="tab" data-tab="hires">Hires & KPIs</button>
  </nav>

  <main class="content">
    <section id="overview" class="tab-content active">
      <h2>Overview</h2>
      <p>Current role status and pipeline snapshot.</p>
    </section>

    <section id="pipeline" class="tab-content">
      <h2>Pipeline</h2>
      <p>Weekly pipeline health by role.</p>
    </section>

    <section id="sourcing" class="tab-content">
      <h2>Sourcing</h2>
      <p>Weekly sourcing KPIs.</p>
    </section>

    <section id="hires" class="tab-content">
      <h2>Hires & KPIs</h2>
      <p>Time to hire, time to fill and hiring efficiency.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
