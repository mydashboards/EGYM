name: Validate dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [global-filters]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check app.js
        run: node --check app.js

      - name: Syntax check global-filters.js
        run: node --check global-filters.js

      - name: Verify global filter script is loaded
        run: grep -q '<script src="./global-filters.js"></script>' index.html

      - name: Verify critical filter controls exist
        run: |
          grep -q 'id="globalPeriodModeSelect"' global-filters.js
          grep -q 'id="globalDepartmentSelect"' global-filters.js
          grep -q 'id="globalRoleSelect"' global-filters.js
          grep -q 'id="globalRecruiterSelect"' global-filters.js
